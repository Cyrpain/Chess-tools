<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chessboard Tile Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Chessboard Tile Quiz</h1>
    <p id="tile-display">Tile: <span id="current-tile">--</span></p>
    <input type="text" id="user-input" placeholder="Black or White?" autofocus />
    <button id="submit-btn">Submit</button>
    <p id="score-display">Score: <span id="score">0</span></p>
    <p id="message"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
